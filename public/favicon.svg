<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Slush Inflatable Sticker Universe: EventiQ Haute Atelier Celebration Emblem -->
  <!-- Circular Sunburst Sticker Base with 1px/2px Hand-cut Carbon Outline -->
  <circle cx="32" cy="32" r="29" fill="#ffd731" stroke="#000000" stroke-width="3.5" />

  <!-- Confetti Elements in Background of Sticker -->
  <circle cx="16" cy="19" r="2" fill="#4da2ff" stroke="#000000" stroke-width="1.5" />
  <circle cx="48" cy="46" r="2.2" fill="#55db9c" stroke="#000000" stroke-width="1.5" />
  <circle cx="15" cy="34" r="1.8" fill="#e9ccff" stroke="#000000" stroke-width="1.5" />

  <!-- Celebration Party Popper Group Angled at 45° -->
  <g transform="translate(29, 36) rotate(-45)">
    <!-- Confetti Streamer Ribbons -->
    <path d="M -3 -4 C -7 -10 -3 -15 -6 -19" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />
    <path d="M 4 -4 C 9 -9 11 -13 9 -18" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" />

    <!-- Confetti Discs -->
    <circle cx="-13" cy="-11" r="2.8" fill="#55db9c" stroke="#000000" stroke-width="1.8" />
    <circle cx="14" cy="-10" r="3" fill="#4da2ff" stroke="#000000" stroke-width="1.8" />
    <circle cx="6" cy="-28" r="2.2" fill="#fb4903" stroke="#000000" stroke-width="1.6" />

    <!-- Small 4-Point Lavender Star -->
    <path
      d="M -13 -21 C -13 -18 -10 -16 -7 -16 C -10 -16 -13 -14 -13 -11 C -13 -14 -16 -16 -19 -16 C -16 -16 -13 -18 -13 -21 Z"
      fill="#e9ccff"
      stroke="#000000"
      stroke-width="1.8"
      stroke-linejoin="round"
    />

    <!-- Hero 4-Point Paper White Star Burst -->
    <path
      d="M 0 -30 C 0 -25 5 -23 10 -23 C 5 -23 0 -21 0 -16 C 0 -21 -5 -23 -10 -23 C -5 -23 0 -25 0 -30 Z"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Cone Body (Ember Orange) -->
    <path
      d="M 0 16 L -10 -3 C -10 -3 0 2 10 -3 Z"
      fill="#fb4903"
      stroke="#000000"
      stroke-width="2.6"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Cone Decorative Ribbon Stripe (Paper White) -->
    <path
      d="M -6 4 Q 0 7 6 4 L 4 8 Q 0 11 -4 8 Z"
      fill="#ffffff"
      stroke="#000000"
      stroke-width="1.6"
      stroke-linejoin="round"
    />

    <!-- Cone Opening Rim (Mint Pop) -->
    <path
      d="M -10 -3 C -10 -7 10 -7 10 -3 C 10 1 -10 1 -10 -3 Z"
      fill="#55db9c"
      stroke="#000000"
      stroke-width="2.2"
      stroke-linejoin="round"
    />
  </g>
</svg>